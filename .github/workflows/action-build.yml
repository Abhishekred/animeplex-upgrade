name: Action build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: action-build-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: standalone
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      PROXY_API_URL: ${{ secrets.PROXY_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android CMake
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install 'cmake;3.22.1' && "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Android CMake installation failed after three attempts.' >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install dependencies
        run: npm ci

      - name: Generate Android phone project
        run: npm run build:sandbox && npx expo prebuild --platform android --clean --no-install

      - name: Configure unsigned release
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="android/app/build.gradle"
          test -f "$GRADLE_FILE"
          sed -i '/signingConfig signingConfigs\.release/d' "$GRADLE_FILE"
          chmod +x android/gradlew
          mkdir -p "$RUNNER_TEMP/action-build-files"

      - name: Build unsigned Android phone APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleRelease --build-cache --no-daemon --max-workers=2 --no-parallel --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'

      - name: Verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*unsigned.apk')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one unsigned phone APK; found ${#APKS[@]}."
            find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          if "$APKSIGNER" verify "${APKS[0]}" >/dev/null 2>&1; then
            echo "ERROR: APK unexpectedly has a valid signature."
            exit 1
          fi
          echo "Unsigned APK verified: ${APKS[0]}"
          node scripts/collect-action-build.cjs apk "$RUNNER_TEMP/action-build-files/vega.apk"

      - name: Replace the Action build draft assets
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/update-action-build-release.cjs')({
              github, context, core,
              artifactDirectory: `${process.env.RUNNER_TEMP}/action-build-files`,
            });
