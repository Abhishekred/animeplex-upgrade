name: Android APK Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  build-android:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate standalone Android project
        env:
          APP_VARIANT: standalone
        run: npm run build:sandbox && npx expo prebuild --platform android --clean

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p apks
          find android/app/build/outputs/apk/release -type f -name '*.apk' -exec cp {} apks/ \\;
          if [ -z "$(find apks -maxdepth 1 -type f -name '*.apk' -print -quit)" ]; then
            echo "No APK was generated."
            exit 1
          fi
          ls -lh apks/

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Vega-standalone-unsigned-APK
          path: apks/*.apk
          if-no-files-found: error
          retention-days: 14
