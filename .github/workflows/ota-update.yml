name: Publish AnimePlex OTA Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish compatible JS/assets update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update to EAS production branch
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub Actions secret EXPO_TOKEN."
            exit 1
          fi
          npx eas-cli update --branch production --platform android --message "Admin-triggered OTA ${GITHUB_SHA}" --non-interactive
